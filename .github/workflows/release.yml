name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # Vaults made from this template must not cut brain-starter releases or bump .brain-starter.json.
    if: github.repository == 'michaeljauk/brain-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
      - name: Request review
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ fromJSON(steps.release.outputs.pr).number }} --repo ${{ github.repository }} --add-reviewer ${{ github.repository_owner }}
